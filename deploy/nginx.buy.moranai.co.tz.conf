# buy.moranai.co.tz for Moran's Docker nginx: append both blocks to Moran's deploy/nginx.full.conf, but only after the certificate exists.
# The MoranBuy API joins Moran's Docker network as moranbuy-api; the address is a variable so Moran's nginx still starts while MoranBuy is down.
# Moran's file already sets "resolver 127.0.0.11" at the top, which this needs.

server {
    listen 80;
    server_name buy.moranai.co.tz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name buy.moranai.co.tz;
    ssl_certificate     /etc/letsencrypt/live/buy.moranai.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buy.moranai.co.tz/privkey.pem;
    # Uploads (images 5 MB, PDFs 10 MB, voice 16 MB) and Moran's signed forwards of voice notes and photos, base64 encoded.
    client_max_body_size 25m;
    # HSTS comes from the app (helmet), so it is not added here a second time.

    location / {
        set $moranbuy_api http://moranbuy-api:4000;
        proxy_pass $moranbuy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
