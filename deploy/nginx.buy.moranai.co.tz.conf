# buy.moranai.co.tz -> the MoranBuy API on this VPS (same machine as api.moranai.co.tz, separate service).
# Install: /etc/nginx/sites-available/buy.moranai.co.tz, symlink into sites-enabled, then
#   certbot --nginx -d buy.moranai.co.tz
upstream moranbuy_api { server 127.0.0.1:4000; keepalive 32; }

server {
    listen 80;
    server_name buy.moranai.co.tz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name buy.moranai.co.tz;
    ssl_certificate /etc/letsencrypt/live/buy.moranai.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buy.moranai.co.tz/privkey.pem;
    client_max_body_size 2m;

    location / {
        proxy_pass http://moranbuy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
