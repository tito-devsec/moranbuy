<style>
:root{--brand:#0b4a3a;--brand-dark:#073529;--green:#00d17a;--band:#111111;--band-text:#ebe9e4;--ink:#111111;--muted:#5f5f5a;--line:#c9c6bf;--bg:#ebe9e4;--soft:#e2dfd8;--link:#0b4a3a;--d:"Bebas Neue","Oswald",Impact,"Arial Narrow",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
.titlebar{position:sticky;top:0;z-index:5;display:flex;align-items:center;height:64px;background:var(--band);color:var(--band-text)}
.titlebar .back{width:64px;height:64px;display:flex;align-items:center;justify-content:center;border-right:1px solid #333;color:var(--green);font-size:28px;cursor:pointer;background:none;border-top:0;border-bottom:0;border-left:0}
.titlebar h1{flex:1;margin:0;text-align:center;font:400 28px/1 var(--d);letter-spacing:.06em;text-transform:uppercase;padding-right:64px}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;color:var(--ink);font:400 24px/1 var(--d);letter-spacing:.02em;text-transform:uppercase}
.logo svg{width:34px;height:34px}
.actions{display:flex;align-items:center;gap:14px}
.lang{display:flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--ink);font:400 15px/1 var(--d);letter-spacing:.06em;padding:8px 12px;cursor:pointer}
.lang button.on{background:var(--ink);color:var(--bg)}
.open{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font:400 16px/1 var(--d);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);border-radius:4px;padding:9px 12px}
.open:hover{background:var(--ink);color:var(--bg);text-decoration:none}
.menu{border:0;background:none;font-size:24px;color:var(--ink);cursor:pointer;padding:0 4px;border-left:1px solid var(--line);padding-left:14px}
.wrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:220px 1fr;gap:40px;padding:28px 24px 64px}
nav.links{display:flex;flex-direction:column;gap:6px;position:sticky;top:96px;align-self:start}
nav.links a{color:var(--link);font-size:16px;padding:2px 0}
nav.links a.on{font-weight:700;color:var(--brand-dark)}
article h1{font:400 clamp(48px,7vw,96px)/.92 var(--d);text-transform:uppercase;margin:4px 0 14px;letter-spacing:.005em}
article .modified{font-size:14px;color:var(--ink);margin-bottom:26px}
article h2{font:400 34px/1 var(--d);text-transform:uppercase;letter-spacing:.01em;margin:38px 0 10px;padding-top:18px;border-top:1px solid var(--line)}
article h3{font:400 24px/1 var(--d);text-transform:uppercase;letter-spacing:.02em;margin:24px 0 6px}
article p{margin:0 0 14px}
article ul{margin:0 0 16px;padding-left:22px}
article li{margin:4px 0}
article strong{font-weight:700}
.note{background:var(--soft);border-left:4px solid var(--green);padding:12px 16px;border-radius:3px;margin:16px 0;font-size:15px}
.card{border:1px solid var(--ink);border-radius:4px;padding:16px 18px;margin:12px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:18px 24px;text-align:center}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr;gap:18px;padding:18px 18px 48px}
  nav.links{position:static}
  article h1{font-size:44px}
  .open span{display:none}
  .titlebar h1{font-size:24px}
}
@media (max-width:420px){
  .brandbar{padding:10px 12px;gap:8px}
  .actions{gap:8px}
  .logo{font-size:20px;gap:6px}
  .open{padding:8px 9px}
  .lang button{padding:7px 9px}
  .menu{padding-left:10px}
}
html,body{overflow-x:hidden}
@media print{.titlebar,.brandbar,nav.links,footer{display:none}.wrap{display:block}}
</style>

// Each page is a list of blocks: [tag, text] or ['ul', [items]] or ['note', text] or ['html', markup].
const CONTENT = {
  en: {
    terms: { title: 'MoranBuy Terms of Use', blocks: [
      ['h2', 'Welcome to MoranBuy!'],
      ['h3', 'The Service'],
      ['p', 'MoranBuy is a reverse marketplace provided by Moran AI ("Moran AI", "we", "us"), a company based in Dar es Salaam, Tanzania. You tell MoranBuy what you want to buy and what you can pay, on WhatsApp, by text, photo or voice note. MoranBuy finds offers from participating businesses ("Businesses") and shows you the most suitable ones, budget first and location second. These Terms of Use ("Terms") govern your use of MoranBuy, including the MoranBuy WhatsApp account (@moranbuy), buy.moranai.co.tz and the MoranBuy business and admin tools (together, the "Service").'],
      ['p', 'MoranBuy is not the seller. The Business named on an offer sells the product and is responsible for it. MoranBuy connects you, holds your payment under Payment Protection (section 6) and keeps the record of the order.'],
      ['h3', '1. Accepting these Terms'],
      ['p', 'Before MoranBuy answers you for the first time, it asks you to accept these Terms and the Privacy Policy. By tapping "I accept" (or "Nakubali") you agree to them. If you do not accept, MoranBuy does not answer you. When these Terms change in a material way, you will be asked to accept the new version before you continue.'],
      ['h3', '2. Who may use MoranBuy'],
      ['ul', ['You must be at least 18 years old, or use MoranBuy with the permission of a parent or guardian.', 'You must give true information, including the phone number you pay from and the place you want delivery to.', 'Businesses must be lawfully operating, must register with true details, and must hold any licence their products require.']],
      ['h3', '3. How offers are chosen'],
      ['p', 'Ranking is done by fixed rules in our software, never by an AI model on its own. Offers that fit your budget come before those that do not; among similar offers the lower known total cost comes first; then the more convenient location, delivery and availability. An unknown cost (for example a delivery fee not yet confirmed) is shown as "not confirmed", never as zero. We never invent prices, products, stock, distances or fees.'],
      ['h3', '4. Artificial intelligence'],
      ['p', 'MoranBuy uses Meta AI models: Muse Spark to understand requests, photos and voice notes and to write replies; Segment Anything (SAM 3.1) to find products in photos; and Meta\'s MMS voices to speak replies. AI never decides prices, rankings, payments, refunds, disputes or your consent; software rules and people do. AI output can be wrong; if something looks wrong, tell us.'],
      ['h3', '5. Orders'],
      ['ul', ['An order is placed only after MoranBuy reads back the known total and you confirm it.', 'The Business may accept the order (and confirm the delivery fee) or reject it. You are told either way.', 'Prices and stock come from the Business. If the Business cannot supply the product as offered, it must reject the order rather than change it.']],
      ['h3', '6. Payment Protection'],
      ['p', 'When an order is protected, you pay MoranBuy, not the Business. Payment is collected by our licensed payment provider (Snippe) by mobile money (M-Pesa, Airtel Money, Mixx by Yas, HaloPesa) and held by MoranBuy until delivery is proven.'],
      ['ul', [
        '<strong>Receipt and handover code.</strong> After your payment succeeds you receive a receipt and a private handover code. The Business never sees your code.',
        '<strong>Check before you hand over the code.</strong> Give the code to the delivery person only after you have checked the product. Giving the code is your confirmation that you received the right product in acceptable condition.',
        '<strong>Delivery proof.</strong> The delivery person sends a photo of the product at handover and the code you give them. A correct code marks the order delivered.',
        '<strong>Release to the Business.</strong> The payment, less any MoranBuy commission shown to the Business, is released to the Business 48 hours after delivery, or earlier if you reply that you received it, unless you report a hidden defect within those 48 hours.',
        '<strong>Wrong or damaged product at the door.</strong> Do not give the code. The delivery person records the refusal with a photo and reason, you confirm the reason, and you receive a full refund to the number you paid from.',
        '<strong>No delivery.</strong> If the Business does not assign a delivery person within 48 hours of payment, or the order cannot be delivered, you receive a full refund.',
        '<strong>Refund timing.</strong> Refunds are sent by mobile money, normally within 3 working days of the decision.',
      ]],
      ['note', 'A claim that you did not receive a product, made after a correct handover code was used, is refused. The code is the proof of delivery.'],
      ['h3', '7. Disputes'],
      ['p', 'If you and the Business disagree, the payment stays held and a MoranBuy administrator reviews the evidence: the order, the handover-code record, delivery photos, locations and messages. An AI summary may help the administrator, but a person decides whether to release the payment or refund it. We aim to decide within 5 working days and tell both sides the reason.'],
      ['h3', '8. Rules for Businesses'],
      ['ul', [
        'Describe products truthfully, with the real price, and keep stock up to date.',
        'Deliver what was ordered, on time, through a delivery person whose WhatsApp number you register for that order.',
        'Never ask a customer for the handover code before they have checked the product, and never ask them to pay outside MoranBuy for a protected order.',
        'Give a mobile money number for payouts in your own or your business\'s name.',
      ]],
      ['h3', '9. Penalties'],
      ['p', 'A refused delivery caused by the Business (wrong item, damaged item, wrong size or variant, or a product the customer did not order), a missed delivery deadline, or a false claim each counts as a strike against the Business. A claim refused because the evidence shows delivery counts as a strike against the customer. With three strikes in 90 days, new orders or claims are reviewed by a person first. Serious or repeated misuse may lead to suspension or removal from MoranBuy. Payment fees for a refund caused by the Business may be charged to the Business. Strikes and suspensions can be challenged by writing to support@moranai.co.tz.'],
      ['h3', '10. Messages and consent'],
      ['p', 'MoranBuy sends you answers to your requests and updates about your orders, receipts and refunds. Marketing and follow-up messages from a Business are sent only with your consent, and you can stop them at any time by replying STOP.'],
      ['h3', '11. Acceptable use'],
      ['p', 'Do not use MoranBuy for fraud, for illegal or restricted goods, to harass anyone, to send false photos or codes, or for messages unrelated to shopping. We may limit or suspend the Service for misuse.'],
      ['h3', '12. Liability'],
      ['p', 'We provide the Service with reasonable care. The Business is responsible for the product, its quality and safety. Offers marked "found online, not confirmed" are not from MoranBuy Businesses and cannot be ordered through MoranBuy. To the extent the law allows, Moran AI is not liable for indirect losses, and our liability for any order is limited to the amount you paid MoranBuy for that order. Nothing in these Terms limits rights you have under Tanzanian consumer law.'],
      ['h3', '13. Ending use'],
      ['p', 'You may stop using MoranBuy at any time. We may suspend or end access for breach of these Terms. Held payments are released or refunded under section 6 even after access ends.'],
      ['h3', '14. Law'],
      ['p', 'These Terms are governed by the laws of the United Republic of Tanzania. Disputes that cannot be settled with us first go to the competent courts of Tanzania.'],
      ['h3', '15. Contact'],
      ['p', 'Moran AI, Dar es Salaam, Tanzania · support@moranai.co.tz · Hotline +255 724 660 550.'],
    ] },
    privacy: { title: 'MoranBuy Privacy Policy', blocks: [
      ['h2', 'Your privacy at MoranBuy'],
      ['p', 'This policy explains what MoranBuy collects, why, who it is shared with, how long it is kept and your rights. Moran AI, Dar es Salaam, Tanzania, is responsible for this data. We process personal data in line with the Personal Data Protection Act, 2022 of Tanzania.'],
      ['h3', '1. What we collect'],
      ['ul', [
        '<strong>Your requests:</strong> what you want, your budget, place, timing, and the messages, photos and voice notes you send.',
        '<strong>Contact details:</strong> your WhatsApp number and the name WhatsApp shows.',
        '<strong>Location:</strong> the area you describe or a location you share, to rank nearby offers and arrange delivery.',
        '<strong>Orders and payments:</strong> what you ordered, totals, payment references, receipts, refunds and payouts. We do not see your mobile money PIN.',
        '<strong>Delivery evidence:</strong> photos the delivery person takes at handover, the result of the handover code (never the code itself), shared locations and the reason for any refusal.',
        '<strong>Businesses:</strong> business and owner names, phone numbers, payout number, products, prices, locations and verification documents.',
        '<strong>Consent:</strong> when you accepted these terms and whether you agreed to marketing or follow-up.',
      ]],
      ['h3', '2. Why we use it'],
      ['ul', ['To find and rank offers for you and answer your messages.', 'To place, protect and deliver orders, issue receipts, release payments and send refunds.', 'To prevent fraud and settle disputes.', 'To send marketing or follow-up only where you agreed.', 'To produce statistics without names or phone numbers (for example, which products people ask for in which region).', 'To meet legal duties such as keeping financial records.']],
      ['h3', '3. AI and your data'],
      ['p', 'Your messages, photos and voice notes are processed by Meta AI models through the Meta Model API (Muse Spark, Muse Voice Transcribe and SAM 3.1) to understand them. Spoken replies are made inside MoranBuy with Meta\'s MMS voices, so no text leaves our server for speech. Delivery photos are checked by Muse Spark and SAM 3.1 to see whether they show the ordered product. These checks are evidence only; they never decide a payment or dispute.'],
      ['h3', '4. Who we share with'],
      ['ul', ['<strong>The Business</strong> you order from: your name, phone number, order and delivery location.', '<strong>The delivery person</strong> registered by that Business: the order reference and delivery details needed to deliver.', '<strong>Moran AI</strong>, which runs the WhatsApp connection that MoranBuy uses.', '<strong>Snippe</strong>, our payment provider, to collect payments, send payouts and refunds.', '<strong>Meta</strong>, as WhatsApp provider and AI model provider.', '<strong>Authorities</strong>, only when the law requires it.']],
      ['p', 'We do not sell your personal data.'],
      ['h3', '5. How long we keep it'],
      ['ul', ['Voice notes: 30 days. Spoken replies: 7 days. Photos you send: 90 days.', 'Delivery photos: 180 days, for disputes.', 'Orders, payments, receipts, payouts, refunds, the evidence timeline and consent records: kept as financial and legal records.', 'Customers with no order who have not written for 2 years are deleted.', 'Old orders keep the order but lose the delivery location after 2 years.']],
      ['h3', '6. Your rights'],
      ['p', 'You can ask to see, correct or delete your data, object to marketing (reply STOP), or withdraw consent. Some records (orders, payments, receipts) must be kept by law and cannot be deleted while that duty lasts. Write to support@moranai.co.tz.'],
      ['h3', '7. Security'],
      ['p', 'Data is stored on servers we control, secrets are encrypted, handover codes are stored only as one-way codes, receipts carry a check code that shows tampering, and staff access is logged. No system is perfectly secure; tell us at once if you suspect misuse.'],
      ['h3', '8. Children'],
      ['p', 'MoranBuy is not meant for children under 18 without a parent or guardian.'],
      ['h3', '9. Changes'],
      ['p', 'If we change this policy in a material way, we will ask you to accept the new version before you continue.'],
    ] },
    about: { title: 'About Us', blocks: [
      ['h2', 'Moran AI'],
      ['p', 'Moran AI was founded in 2026 in Dar es Salaam to give every African business a tireless assistant on WhatsApp. Its AI agents answer customers, take orders and follow up for businesses in Tanzania, Kenya, Uganda, Rwanda and South Africa.'],
      ['h2', 'MoranBuy'],
      ['p', 'MoranBuy is a product of Moran AI that turns shopping around. Instead of searching shop by shop, a customer says once what they want and what they can pay. MoranBuy brings back the best five real offers from local businesses, budget first, location second, and explains why each was chosen.'],
      ['ul', ['<strong>For customers:</strong> ask by text, photo or voice note in Swahili or English; pay safely with Payment Protection; get a receipt for every order.', '<strong>For businesses:</strong> list products by chat or by one photo of a shelf, receive ready-to-pay orders, and get insights on what people near you are asking for.', '<strong>For trust:</strong> money is held until the handover code proves delivery.']],
      ['p', 'MoranBuy runs on Meta AI models: Muse Spark, Segment Anything (SAM 3.1), Muse Voice Transcribe and MMS text-to-speech.'],
    ] },
    developers: { title: 'Developers', blocks: [
      ['h2', 'Built by Moran AI'],
      ['p', 'MoranBuy is designed and built by the Moran AI engineering team. Technical lead: <strong>Tito Oscar Mwaisengela</strong> (<a href="https://github.com/tito-devsec">tito-devsec</a>), Co-founder and CTO of Moran AI.'],
      ['div', [['Leadership', 'Maziku, Co-founder and CEO · Tito Oscar Mwaisengela, Co-founder and CTO'], ['Source code', '<a href="https://github.com/tito-devsec/moranbuy">github.com/tito-devsec/moranbuy</a>']]],
      ['h3', 'How it is built'],
      ['ul', ['Node.js API and workers, PostgreSQL for every record, Redis for timed work.', 'Meta AI: Muse Spark 1.3 (text and vision), Muse Spark 1.2 audio and Muse Voice Transcribe (voice notes), SAM 3.1 (products in photos), MMS text-to-speech (spoken replies, run in-process).', 'Rules, not models, decide prices, rankings, money and disputes; every AI answer has a plain fallback.', 'Signed channels between Moran AI and MoranBuy, signed receipts, encrypted secrets and an audit trail.']],

      ['p', 'Developers and partners can write to hello@moranai.co.tz. Security reports go to support@moranai.co.tz with "Security" in the subject.'],
    ] },
    contact: { title: 'Contact Us', blocks: [
      ['h2', 'We are happy to help'],
      ['p', 'Questions about an order, a refund, a dispute, listing your business or your data? Reach Moran AI any of these ways.'],
      ['div', [['Support', '<a href="mailto:support@moranai.co.tz">support@moranai.co.tz</a>'], ['Sales and businesses', '<a href="mailto:sales@moranai.co.tz">sales@moranai.co.tz</a>'], ['Hotline', '<a href="tel:+255724660550">+255 724 660 550</a>'], ['General', '<a href="mailto:hello@moranai.co.tz">hello@moranai.co.tz</a>']]],
      ['p', 'Moran AI, Dar es Salaam, Tanzania · <a href="https://moranai.co.tz">moranai.co.tz</a>'],
      ['note', 'For an order, include your order number (for example MB-7K2Q9P). Never share your handover code or mobile money PIN with anyone, including us.'],

const esc = (s) => String(s);
function pageFromPath() {
  const p = location.pathname.replace(/\/+$/, '').split('/').pop();
  const alias = { terms: 'terms', privacy: 'privacy', about: 'about', developers: 'developers', contact: 'contact', copyright: 'copyright' };
  return alias[p] || (PAGES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'terms');
}
let lang = 'en';
try { lang = localStorage.getItem('mb_lang') === 'sw' ? 'sw' : 'en'; } catch {}
if (new URLSearchParams(location.search).get('lang') === 'sw') lang = 'sw';

function render() {
  const page = pageFromPath();
  const c = CONTENT[lang][page];
  document.documentElement.lang = lang;
  document.title = `MoranBuy · ${NAV[lang][page]}`;
  document.getElementById('bar-title').textContent = NAV[lang][page].replace('Masharti ya Matumizi', 'Masharti');
  document.getElementById('open-label').textContent = UI[lang].open;
  document.getElementById('lang-en').classList.toggle('on', lang === 'en');
  document.getElementById('lang-sw').classList.toggle('on', lang === 'sw');
  document.getElementById('links').innerHTML = PAGES.map((k) => `<a href="/${k}" class="${k === page ? 'on' : ''}">${NAV[lang][k]}</a>`).join('');
  const body = c.blocks.map(([tag, v]) => {
    if (tag === 'ul') return `<ul>${v.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>`;
    if (tag === 'note') return `<div class="note">${esc(v)}</div>`;
    if (tag === 'div') return `<div class="grid2">${v.map(([h, t]) => `<div class="card"><strong>${h}</strong><br>${t}</div>`).join('')}</div>`;
    return `<${tag}>${esc(v)}</${tag}>`;
  }).join('');
  document.getElementById('content').innerHTML = `<h1>${c.title}</h1><div class="modified">${UI[lang].modified}: ${MODIFIED}</div>${body}`;
  document.getElementById('foot').textContent = UI[lang].foot;
  updateOpenLink();
}
// "Open MoranBuy" starts a WhatsApp chat with the MoranBuy username, greeting already typed.
let whatsappLink = 'https://wa.me/moranbuy';
function updateOpenLink() {
  const a = document.getElementById('open-link');
  a.href = `${whatsappLink}?text=${encodeURIComponent(lang === 'sw' ? 'Habari MoranBuy' : 'Hello MoranBuy')}`;
  a.target = '_blank';
}
fetch('/api/public/contact').then((r) => r.json()).then((c) => { whatsappLink = c.whatsapp?.link || whatsappLink; updateOpenLink(); }).catch(() => {});
function setLang(l) { lang = l; try { localStorage.setItem('mb_lang', l); } catch {} render(); }
function goBack() { if (history.length > 1 && document.referrer.startsWith(location.origin)) history.back(); else location.href = '/'; }
render();
