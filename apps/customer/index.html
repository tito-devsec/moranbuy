<!doctype html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoranBuy</title>
  <style>
    :root { --teal: #0f766e; --bg: #f6f8f8; --ink: #111827; --muted: #6b7280; --card: #fff; --line: #e5e7eb; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--ink); }
    header { background: var(--teal); color: #fff; padding: 14px 16px; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header p { margin: 2px 0 0; font-size: 13px; opacity: .9; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .chat { display: flex; flex-direction: column; gap: 10px; min-height: 50vh; }
    .msg { max-width: 85%; padding: 10px 12px; border-radius: 14px; white-space: pre-wrap; }
    .me { align-self: flex-end; background: #111827; color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .bot img { max-width: 100%; border-radius: 10px; display: block; margin-bottom: 6px; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    form { display: flex; gap: 8px; margin-top: 14px; position: sticky; bottom: 0; background: var(--bg); padding: 8px 0; }
    input[type=text] { flex: 1; padding: 12px; border: 1px solid var(--line); border-radius: 12px; font: inherit; }
    button { padding: 12px 16px; border: 0; border-radius: 12px; background: var(--teal); color: #fff; font: inherit; cursor: pointer; }
    button.ghost { background: #fff; color: var(--teal); border: 1px solid var(--teal); }
    .hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  </style>
</head>
<body>
  <header><h1>MoranBuy</h1><p>Sema unachohitaji na bajeti yako. Tunakuletea ofa zinazofaa, bei na bajeti kwanza, kisha ukaribu.</p></header>
  <main>
    <p class="hint">Mfano: <em>Nina TSh 350,000 ya sofa ya watu watatu. Nipo Sinza, Dar es Salaam. Nataka delivery ikiwezekana.</em></p>
    <div class="chat" id="chat"></div>
    <form id="form">
      <input type="text" id="text" placeholder="Andika ujumbe..." autocomplete="off" required>
      <button type="button" class="ghost" id="loc" title="Tuma location yako">📍</button>
      <button type="button" class="ghost" id="cam" title="Tuma picha ya unachotafuta">📷</button>
      <button type="button" class="ghost" id="mic" title="Bonyeza kurekodi sauti, bonyeza tena kutuma">🎤</button>
      <input type="file" id="photo" accept="image/jpeg,image/png,image/webp" hidden>
      <button type="submit">Tuma</button>
    </form>
  </main>
  <script>
    // A thin client over POST /api/shop/messages; the customer token keeps the session in this browser only.
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('text');
    let token = null;
    try { token = localStorage.getItem('moranbuy_customer') || null; } catch {}
    let pendingLocation = null;

    function add(role, text, imageUrl, meta) {
      const el = document.createElement('div');
      el.className = `msg ${role}`;
      if (imageUrl) { const img = document.createElement('img'); img.src = imageUrl; img.alt = ''; el.appendChild(img); }
      el.appendChild(document.createTextNode(text || ''));
      if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; el.appendChild(m); }
      chat.appendChild(el);
      el.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    // The terms question comes from the server and is shown with two buttons; nothing is answered until Accept.
    function showTerms(terms) {
      const el = document.createElement('div'); el.className = 'msg bot';
      el.appendChild(document.createTextNode(terms.text));
      const row = document.createElement('div'); row.style.marginTop = '8px'; row.style.display = 'flex'; row.style.gap = '8px';
      const yes = document.createElement('button'); yes.textContent = terms.accept; yes.onclick = () => { row.remove(); send('', { acceptTerms: true }); };
      const no = document.createElement('button'); no.className = 'ghost'; no.textContent = terms.reject; no.onclick = () => { row.remove(); send('', { rejectTerms: true }); };
      row.append(yes, no); el.appendChild(row);
      const links = document.createElement('div'); links.className = 'meta'; links.innerHTML = `<a href="${terms.termsUrl}" target="_blank" rel="noopener">Masharti / Terms</a> · <a href="${terms.privacyUrl}" target="_blank" rel="noopener">Faragha / Privacy</a>`;
      el.appendChild(links); chat.appendChild(el); el.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    // A photo of what the customer wants: uploaded privately, then sent with whatever they typed.
    const photo = document.getElementById('photo');
    document.getElementById('cam').onclick = () => photo.click();
    photo.onchange = async () => {
      const f = photo.files[0]; photo.value = '';
      if (!f) return;
      if (!token) { add('bot', 'Tafadhali tuma ujumbe kwanza na ukubali masharti, kisha utume picha. / Send a message and accept the terms first.'); return; }
      const res = await fetch(`/api/shop/uploads?customerToken=${encodeURIComponent(token)}`, { method: 'POST', headers: { 'Content-Type': f.type || 'application/octet-stream' }, body: f });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { add('bot', data.message || 'Picha haikupokelewa.'); return; }
      add('me', input.value || '📷', URL.createObjectURL(f));
      const text = input.value; input.value = '';
      await send(text, { photoUploadId: data.uploadId, silent: true });
    };

    // Records a voice message as 16 kHz WAV right in the browser, so the server only has to read it, never convert it.
    const mic = document.getElementById('mic');
    let rec = null;
    function toWav16k(chunks, rate) {
      const len = chunks.reduce((n, c) => n + c.length, 0);
      const all = new Float32Array(len); let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
      const outLen = Math.floor(len * 16000 / rate); const pcm = new DataView(new ArrayBuffer(44 + outLen * 2));
      const w = (p, s) => { for (let i = 0; i < s.length; i += 1) pcm.setUint8(p + i, s.charCodeAt(i)); };
      w(0, 'RIFF'); pcm.setUint32(4, 36 + outLen * 2, true); w(8, 'WAVE'); w(12, 'fmt '); pcm.setUint32(16, 16, true); pcm.setUint16(20, 1, true); pcm.setUint16(22, 1, true);
      pcm.setUint32(24, 16000, true); pcm.setUint32(28, 32000, true); pcm.setUint16(32, 2, true); pcm.setUint16(34, 16, true); w(36, 'data'); pcm.setUint32(40, outLen * 2, true);
      for (let i = 0; i < outLen; i += 1) { const v = Math.max(-1, Math.min(1, all[Math.floor(i * rate / 16000)] || 0)); pcm.setInt16(44 + i * 2, v * 32767, true); }
      return new Blob([pcm], { type: 'audio/wav' });
    }
    mic.onclick = async () => {
      if (!token) { add('bot', 'Tafadhali tuma ujumbe kwanza na ukubali masharti, kisha utume sauti. / Send a message and accept the terms first.'); return; }
      if (!rec) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const source = ctx.createMediaStreamSource(stream); const node = ctx.createScriptProcessor(4096, 1, 1); const chunks = [];
          node.onaudioprocess = (e) => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
          source.connect(node); node.connect(ctx.destination);
          rec = { stream, ctx, node, chunks, started: Date.now() }; mic.textContent = '⏹'; mic.title = 'Bonyeza kutuma sauti';
        } catch { add('bot', 'Kipaza sauti hakipatikani. / The microphone is not available.'); }
        return;
      }
      const r = rec; rec = null; mic.textContent = '🎤';
      r.node.disconnect(); r.stream.getTracks().forEach((t) => t.stop());
      const wav = toWav16k(r.chunks, r.ctx.sampleRate); r.ctx.close();
      if (Date.now() - r.started < 700) return;
      add('me', '🎤 …', null, '');
      const up = await fetch(`/api/shop/uploads?kind=voice&customerToken=${encodeURIComponent(token)}`, { method: 'POST', headers: { 'Content-Type': 'audio/wav' }, body: wav });
      const data = await up.json().catch(() => ({}));
      if (!up.ok) { add('bot', data.message || 'Sauti haikupokelewa.'); return; }
      if (!data.heard) { add('bot', 'Sikuweza kusikia sauti hiyo. Tafadhali andika. / I could not hear that; please type.'); return; }
      add('me', `🎤 ${data.transcript}`, null, data.source ? `heard by ${data.source}` : '');
      await send('', { voiceUploadId: data.uploadId, silent: true });
    };

    async function send(text, extra = {}) {
      const { silent, ...rest } = extra;
      if (!silent && (text || pendingLocation)) add('me', text || '📍 location');
      const body = { customerToken: token || undefined, text, location: pendingLocation || undefined, ...rest };
      pendingLocation = null;
      const res = await fetch('/api/shop/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) { add('bot', data.message || 'Samahani, kuna hitilafu.'); return; }
      token = data.customerToken;
      try { localStorage.setItem('moranbuy_customer', token); } catch {}
      if (data.state === 'terms_required') { showTerms(data.terms); return; }
      for (const r of data.replies) add('bot', r.text || r.caption, r.imageUrl, r.imageUrl ? '' : `state: ${data.state}${data.museStatus ? ` · muse: ${data.museStatus}` : ''}`);
      // The spoken reply plays under the written one.
      if (data.voiceReply) { const el = document.createElement('div'); el.className = 'msg bot'; const a = document.createElement('audio'); a.controls = true; a.src = data.voiceReply.dataUrl; el.appendChild(a); chat.appendChild(el); el.scrollIntoView({ behavior: 'smooth', block: 'end' }); a.play().catch(() => {}); }
    }

    form.addEventListener('submit', async (e) => { e.preventDefault(); const t = input.value.trim(); if (!t && !pendingLocation) return; input.value = ''; await send(t); });
    document.getElementById('loc').addEventListener('click', () => {
      if (!navigator.geolocation) return add('bot', 'Kivinjari hiki hakitoi location.');
      navigator.geolocation.getCurrentPosition((p) => { pendingLocation = { lat: p.coords.latitude, lng: p.coords.longitude }; send(input.value.trim()); input.value = ''; }, () => add('bot', 'Sikuweza kupata location yako. Andika mtaa na mji.'));
    });
    add('bot', 'Karibu MoranBuy. Niambie bidhaa unayotaka, bajeti yako ya juu, na ulipo.');
  </script>
</body>
</html>
