name: Feature request
description: Propose a change or addition to MoranBuy
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem does this solve? }
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Reverse marketplace and ranking, Customer experience, Business app, Admin app, Campaign engine, New-product outreach, Follow-up, Consent and privacy, Muse Spark, Moran integration, Deployment]
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
